services:
  claude-desktop:
    build:
      context: .
      args:
        # Change the VNC login password at build time (default: "claude")
        VNC_PASSWORD: "${VNC_PASSWORD:-claude}"
    image: claude-desktop:latest
    container_name: claude-desktop

    # ── Display options (choose one) ──────────────────────────────────────────
    # Option A — VNC (default, works on any OS):
    #   Connect any VNC client to localhost:5900.
    #   Password: VNC_PASSWORD (default: claude)
    #
    # Option B — X11 forwarding (Linux hosts only):
    #   Comment out the 'ports' block and uncomment the X11 blocks below.

    ports:
      - "${VNC_PORT:-5900}:5900"

    # Option B — X11 forwarding (uncomment all three blocks):
    # environment:
    #   DISPLAY: "${DISPLAY}"
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Run first: xhost +local:docker

    environment:
      DISPLAY_RESOLUTION: "${DISPLAY_RESOLUTION:-1920x1080x24}"
      NO_VNC: "${NO_VNC:-0}"

    # Persist config and cache across container restarts
    volumes:
      - claude_config:/home/claude/.config/Claude
      - claude_cache:/home/claude/.cache/Claude

    # Electron requires relaxed seccomp to start
    security_opt:
      - seccomp:unconfined

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "bash", "-c", "DISPLAY=:99 xdpyinfo > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  claude_config:
  claude_cache:
