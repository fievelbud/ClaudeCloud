services:
  claude-desktop:
    build:
      context: .
      args:
        # Point to a .deb build of Claude Desktop for Linux.
        # Obtain the latest URL from https://claude.ai/download
        CLAUDE_DEB_URL: "${CLAUDE_DEB_URL:-}"
        VNC_PASSWORD: "${VNC_PASSWORD:-claude}"
        DISPLAY_RESOLUTION: "${DISPLAY_RESOLUTION:-1920x1080x24}"
    image: claude-desktop:latest
    container_name: claude-desktop

    # ── Display options (choose one) ──────────────────────────────────────────
    # Option A — X11 forwarding (Linux host only):
    #   Set DISPLAY env var and share the X socket.
    #   Uncomment the environment + volumes blocks below and comment out the
    #   ports block.
    #
    # Option B — VNC (default, works on any host):
    #   Connect a VNC client to localhost:5900 (password: see VNC_PASSWORD).

    ports:
      - "${VNC_PORT:-5900}:5900"    # VNC

    # Option A — uncomment for X11 forwarding on Linux:
    # environment:
    #   DISPLAY: "${DISPLAY}"
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      DISPLAY_RESOLUTION: "${DISPLAY_RESOLUTION:-1920x1080x24}"

    # Persist Claude Desktop config and cache between runs
    volumes:
      - claude_config:/home/claude/.config/Claude
      - claude_cache:/home/claude/.cache/Claude

    # Required for Electron sandbox
    security_opt:
      - seccomp:unconfined
    # Alternative to seccomp:unconfined — add only the caps Electron needs:
    # cap_add:
    #   - SYS_ADMIN

    restart: unless-stopped

    # Health-check: verify the Xvfb virtual display is up
    healthcheck:
      test: ["CMD", "bash", "-c", "DISPLAY=:99 xdpyinfo > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  claude_config:
  claude_cache:
