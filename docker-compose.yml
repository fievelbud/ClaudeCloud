services:
  claude-desktop:
    build:
      context: .
    image: claude-desktop:latest
    container_name: claude-desktop

    # ── Display options ────────────────────────────────────────────────────────
    # Xpra HTML5 client — open http://<host>:<XPRA_PORT> in any browser.
    # No VNC client or extra software required.

    ports:
      - "${XPRA_PORT:-10000}:10000"

    environment:
      DISPLAY_RESOLUTION: "${DISPLAY_RESOLUTION:-1920x1080x24}"

    # Persist config and cache across container restarts
    volumes:
      - claude_config:/home/claude/.config/Claude
      - claude_cache:/home/claude/.cache/Claude

    # Electron requires relaxed seccomp to start
    security_opt:
      - seccomp:unconfined

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "bash", "-c", "ss -tln | grep ':10000'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  claude_config:
  claude_cache:
