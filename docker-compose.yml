# ── Shared config applied to every instance via YAML anchor ──────────────────
x-claude-common: &claude-common
  image: claude-desktop:latest
  environment:
    DISPLAY_RESOLUTION: "${DISPLAY_RESOLUTION:-1920x1080x24}"
  security_opt:
    - seccomp:unconfined
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "bash", "-c", "cat </dev/null >/dev/tcp/localhost/10000"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:

  # ── Instance 1 — your primary session (existing volumes preserved) ──────────
  claude-desktop-1:
    <<: *claude-common
    build:
      context: .
    container_name: claude-desktop-1
    ports:
      - "10000:10000"
    volumes:
      - /mnt/Data/claude-config:/home/claude/.config/Claude
      - /mnt/Data/claude-cache:/home/claude/.cache/Claude
      - /mnt/Data/claude-data:/home/claude/data

  # ── Instances 2–10 — start on demand: docker compose up -d claude-desktop-N ─
  claude-desktop-2:
